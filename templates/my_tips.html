<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tips</title>
</head>
<body>
    <h1>My Tips</h1>
    {% if tips %}
        <ul>
        {% for tip in tips %}
            <li>{{ tip.content }} ({{ tip.timestamp }})</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No tips submitted yet.</p>
    {% endif %}
    <a href="{{ url_for('home') }}">Back to Home</a>
</body>
</html>
