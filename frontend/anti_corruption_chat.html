<style>
    #query-container {
        max-width: 600px;
        margin: 20px auto;
    }
    #query-input {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        box-sizing: border-box;
    }
    .et_pb_button_module_wrapper {
        display: flex;
        gap: 10px;
    }
    #submit-query.et_pb_button, .et_pb_button_1 {
        padding: 10px 20px;
        border-radius: 5px;
        transition: all 300ms ease 0ms;
        cursor: pointer;
    }
    #response-container {
        margin-top: 20px;
        padding: 15px;
        background-color: #f9f9f9;
        border-radius: 5px;
        white-space: pre-wrap;
    }
    .message {
        margin-bottom: 15px;
    }
    .user-message {
        font-size: 18px;
        font-weight: bold;
        line-height: 1.3em;
        color: #00918B !important;
    }
    .assistant-message {
        font-size: 16px;
    }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const SERVER_URL = "https://anti-corruption-bot.vercel.app";
    let chatId = localStorage.getItem("chat_id") || Date.now().toString();
    const userId = <?php echo is_user_logged_in() ? get_current_user_id() : 'null'; ?>;

    const submitButton = document.getElementById("submit-query");
    if (submitButton) {
        submitButton.addEventListener("click", submitQuery);
        console.log("Submit button event listener attached");
    } else {
        console.error("Submit button not found!");
    }

    // Fetch history
    fetch(`${SERVER_URL}/api/history?chat_id=${chatId}${userId ? `&user_id=${userId}` : ''}`, { method: "GET" })
        .then(response => {
            if (!response.ok) throw new Error(`History fetch failed: ${response.status}`);
            return response.json();
        })
        .then(data => displayHistory(data.history))
        .catch(error => {
            console.error("History fetch error:", error);
            document.getElementById("response-container").innerHTML += `<div class="message assistant-message">Error loading history: ${error.message}</div>`;
        });

    async function submitQuery(event) {
        event.preventDefault();
        console.log("Send button clicked!");
        const queryInput = document.getElementById("query-input");
        const query = queryInput.value.trim();
        if (!query) {
            document.getElementById("response-container").innerHTML += `<div class="message assistant-message">Please enter a tip.</div>`;
            return;
        }

        const responseContainer = document.getElementById("response-container");
        responseContainer.innerHTML += `<div class="message user-message">You: ${query}</div>`;

        try {
            const queryData = { query, chat_id: chatId };
            if (userId) queryData.user_id = userId;

            const response = await fetch(`${SERVER_URL}/api/query`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(queryData),
                mode: "cors"
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Server error: ${response.status} - ${errorText}`);
            }

            const data = await response.json();

            if (data.error) {
                responseContainer.innerHTML += `<div class="message assistant-message">Error: ${data.error}</div>`;
            } else {
                responseContainer.innerHTML += `<div class="message assistant-message">Assistant: ${data.response}</div>`;
                localStorage.setItem("chat_id", data.chat_id);
            }
        } catch (error) {
            console.error("Query fetch error:", error);
            responseContainer.innerHTML += `<div class="message assistant-message">Error: ${error.message}</div>`;
        }

        queryInput.value = "";
        responseContainer.scrollTop = responseContainer.scrollHeight;
    }

    function displayHistory(history) {
        const responseContainer = document.getElementById("response-container");
        history.forEach(msg => {
            const className = msg.role === "user" ? "user-message" : "assistant-message";
            const prefix = msg.role === "user" ? "You" : "Assistant";
            responseContainer.innerHTML += `<div class="message ${className}">${prefix}: ${msg.content}</div>`;
        });
        responseContainer.scrollTop = responseContainer.scrollHeight;
    }
});
</script>
